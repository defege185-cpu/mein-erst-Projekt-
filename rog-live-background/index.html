<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROG Live Background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --red: #a3000f;        /* deep red */
    --red-hi: #d4001a;     /* highlight */
    --red-glow: rgba(200, 0, 20, .55);
    --loop: 12s;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Orbitron", "Arial Black", Impact, sans-serif; cursor: none; }

  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #120002 0%, #050000 45%, #000 75%);
  }

  /* slow breathing red aura behind the logo */
  .aura {
    position: absolute; left: 50%; top: 42%;
    width: 90vmin; height: 90vmin; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(150,0,15,.35) 0%, rgba(90,0,8,.15) 35%, transparent 65%);
    filter: blur(2vmin);
    animation: aura var(--loop) ease-in-out infinite;
  }
  @keyframes aura {
    0%   { opacity: 0;  transform: translate(-50%,-50%) scale(.7); }
    10%  { opacity: 1;  transform: translate(-50%,-50%) scale(1); }
    50%  { opacity: .55; transform: translate(-50%,-50%) scale(1.08); }
    88%  { opacity: 1;  transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0;  transform: translate(-50%,-50%) scale(.9); }
  }

  /* faint horizontal scan lines for a live-screen texture */
  .scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,0,0,.025) 0 1px, transparent 1px 4px);
    mix-blend-mode: screen;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.85) 100%);
  }

  .content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
  }

  .logo {
    position: relative;
    font-weight: 900;
    font-size: 26vmin; line-height: 1;
    letter-spacing: .06em; padding-left: .06em;
    color: var(--red);
    text-shadow: 0 0 1.2vmin var(--red-glow), 0 0 5vmin rgba(160,0,15,.4);
    animation: logo var(--loop) cubic-bezier(.2,.8,.2,1) infinite;
  }
  /* light sweep across the letters */
  .logo::after {
    content: "ROG";
    position: absolute; inset: 0; padding-left: .06em;
    color: transparent;
    background: linear-gradient(100deg, transparent 40%, rgba(255,60,70,.9) 50%, transparent 60%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    animation: sweep var(--loop) linear infinite;
  }
  @keyframes logo {
    0%   { opacity: 0; transform: scale(1.35); filter: blur(2vmin); }
    8%   { opacity: 1; transform: scale(1);    filter: blur(0); }
    50%  { text-shadow: 0 0 2vmin rgba(220,0,25,.7), 0 0 8vmin rgba(180,0,20,.5); }
    90%  { opacity: 1; transform: scale(1);    filter: blur(0); }
    100% { opacity: 0; transform: scale(.96);  filter: blur(1vmin); }
  }
  @keyframes sweep {
    0%, 10% { background-position: 150% 0; }
    22%     { background-position: -50% 0; }
    60%     { background-position: 150% 0; }
    72%     { background-position: -50% 0; }
    100%    { background-position: -50% 0; }
  }

  .divider {
    width: 46vmin; height: .35vmin; margin: 2.2vmin 0 3vmin;
    background: linear-gradient(90deg, transparent, var(--red-hi), transparent);
    box-shadow: 0 0 1.5vmin var(--red-glow);
    transform-origin: center;
    animation: divider var(--loop) ease-out infinite;
  }
  @keyframes divider {
    0%, 8% { transform: scaleX(0); opacity: 0; }
    14%    { transform: scaleX(1); opacity: 1; }
    90%    { transform: scaleX(1); opacity: 1; }
    100%   { transform: scaleX(0); opacity: 0; }
  }

  .title {
    display: flex; flex-direction: column; align-items: center;
    font-weight: 700; color: var(--red);
    text-transform: uppercase;
    text-shadow: 0 0 1vmin var(--red-glow);
  }
  .word { display: block; line-height: 1.1; letter-spacing: .18em; padding-left: .18em; }
  .game, .republic { font-size: 8vmin; }
  .of { font-size: 4.6vmin; letter-spacing: .4em; padding-left: .4em; margin: .6vmin 0; }

  .game     { animation: from-left  var(--loop) cubic-bezier(.16,1,.3,1) infinite; }
  .of       { animation: appear     var(--loop) ease-out infinite; }
  .republic { animation: from-right var(--loop) cubic-bezier(.16,1,.3,1) infinite; }

  @keyframes from-left {
    0%, 12% { transform: translateX(-110vw); opacity: 0; }
    13%     { opacity: 1; }
    22%     { transform: translateX(0); opacity: 1; }
    90%     { transform: translateX(0); opacity: 1; }
    100%    { transform: translateX(0); opacity: 0; }
  }
  @keyframes appear {
    0%, 22% { opacity: 0; transform: scale(.6); filter: blur(1vmin); }
    28%     { opacity: 1; transform: scale(1);  filter: blur(0); }
    90%     { opacity: 1; }
    100%    { opacity: 0; }
  }
  @keyframes from-right {
    0%, 27% { transform: translateX(110vw); opacity: 0; }
    28%     { opacity: 1; }
    37%     { transform: translateX(0); opacity: 1; }
    90%     { transform: translateX(0); opacity: 1; }
    100%    { transform: translateX(0); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="aura"></div>
    <div class="content">
      <div class="logo">ROG</div>
      <div class="divider"></div>
      <div class="title">
        <span class="word game">Game</span>
        <span class="word of">Of</span>
        <span class="word republic">Republic</span>
      </div>
    </div>
    <div class="scan"></div>
    <div class="vignette"></div>
  </div>
</body>
</html>
