<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Détecteur Caméra &amp; Micro</title>
<style>
:root { --bg:#0b1220; --card:#141d31; --text:#e8edf7; --muted:#9aa7c0; --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 16px 0; border-bottom:1px solid #22304d; }
h1 { font-size:1.1rem; margin:0; min-width:0; }
.top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
#lang { width:auto; max-width:40%; padding:6px; font-size:.9rem; }
nav { display:flex; gap:4px; }
.tab { flex:1; background:none; border:none; color:var(--muted); padding:10px 4px; font-size:.95rem; border-bottom:3px solid transparent; }
.tab.active { color:var(--text); border-color:var(--accent); }
#photoCount { background:var(--danger); color:#fff; border-radius:10px; padding:0 7px; font-size:.75rem; }
main { padding:12px 16px 40px; max-width:720px; margin:0 auto; }
.panel { display:none; } .panel.active { display:block; }
#viewer { position:relative; width:100%; aspect-ratio:3/4; max-height:65vh; background:#000; border-radius:14px; overflow:hidden; }
#video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.status { position:absolute; left:8px; right:8px; bottom:8px; padding:8px 10px; border-radius:10px; font-weight:600; text-align:center; background:rgba(0,0,0,.6); }
.status.ok { background:rgba(34,197,94,.85); } .status.alert { background:rgba(239,68,68,.92); animation:pulse .6s infinite alternate; }
@keyframes pulse { to { transform:scale(1.03); } }
#flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .3s; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
button { background:var(--card); color:var(--text); border:1px solid #2a3a5c; border-radius:10px; padding:12px; font-size:1rem; }
button:disabled { opacity:.4; } button.on { background:#facc15; color:#000; }
.controls button { flex:1 1 20%; min-width:0; padding:12px 6px; } .primary { background:var(--accent); border-color:var(--accent); flex:1 1 100% !important; }
.settings { display:grid; gap:10px; background:var(--card); padding:12px; border-radius:12px; }
.settings label { display:grid; gap:4px; font-size:.95rem; }
.settings label.check { display:flex; gap:8px; align-items:center; }
select, input[type=range], #lang { width:100%; font-size:1rem; padding:6px; background:#0f1728; color:var(--text); border:1px solid #2a3a5c; border-radius:8px; }
.card { background:var(--card); padding:12px; border-radius:12px; margin-top:12px; }
.card h3 { margin:0 0 6px; font-size:1rem; }
.card.warn { border-left:4px solid #f59e0b; }
.meter { height:14px; background:#0f1728; border-radius:7px; overflow:hidden; }
#magBar { height:100%; width:0; background:linear-gradient(90deg,var(--ok),#facc15,var(--danger)); transition:width .2s; }
.small { color:var(--muted); font-size:.85rem; }
.row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
#gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.shot { background:var(--card); border-radius:10px; overflow:hidden; }
.shot img { width:100%; display:block; }
.shot .meta { padding:6px 8px; font-size:.8rem; color:var(--muted); }
.shot .acts { display:flex; } .shot .acts button { flex:1; border-radius:0; padding:10px 4px; font-size:1.25rem; }
ol li { margin-bottom:10px; line-height:1.4; }

[dir=rtl] .status { direction:rtl; }
.shot .acts button { min-width:0; }
#lang { width:auto; max-width:45%; font-size:.9rem; }
.modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:16px; }
.modal[hidden] { display:none; }
.modal-box { background:var(--card); border:1px solid #2a3a5c; border-radius:14px; padding:16px; max-width:480px; width:100%; max-height:90vh; overflow:auto; }
.modal-box h2 { margin:0 0 8px; font-size:1.15rem; }
.modal-box li { margin-bottom:8px; line-height:1.4; }
.modal-box li:last-child { color:var(--muted); font-size:.9rem; }
.thumb { display:block; width:100%; padding:0; border:0; border-radius:0; background:none; }
.viewer { position:fixed; inset:0; z-index:30; background:#000; display:flex; align-items:center; justify-content:center; }
.viewer[hidden] { display:none; }
.viewer img { max-width:100%; max-height:100%; object-fit:contain; }
.viewer .close { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:16px; font-size:1.6rem; color:#fff; background:rgba(0,0,0,.5); border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center; }

/* ----- Rapport de scan ----- */
.tab { padding:10px 2px; font-size:.9rem; }
input[type=text], textarea { width:100%; font-size:1rem; padding:8px; background:#0f1728; color:var(--text); border:1px solid #2a3a5c; border-radius:8px; font-family:inherit; }
h3 { font-size:1rem; margin:18px 0 8px; }
.roombar { display:flex; align-items:center; justify-content:space-between; gap:8px; background:#1e3a8a; padding:8px 10px; border-radius:10px; margin-bottom:10px; font-weight:600; }
.roombar button { padding:8px 10px; font-size:.95rem; flex:none; }
.rooms { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.room { background:var(--card); border-radius:10px; padding:10px; }
.room-top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.room-acts { display:flex; gap:8px; margin-top:8px; }
.room-acts button { flex:1; padding:9px 6px; font-size:.95rem; min-width:0; }
.room-acts button[aria-label] { flex:0 0 52px; }
.badge { font-size:.78rem; padding:3px 8px; border-radius:10px; font-weight:600; }
.badge.ok { background:#14532d; color:#bbf7d0; } .badge.warn { background:#713f12; color:#fde68a; }
.badge.bad { background:#7f1d1d; color:#fecaca; } .badge.idle { background:#334155; color:#cbd5e1; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
.chip { padding:6px 10px; font-size:.88rem; border-radius:16px; }
.addroom { display:flex; gap:8px; margin-bottom:12px; } .addroom button { flex:none; }
.wide { width:100%; } .linkbtn { background:none; border:none; color:var(--muted); text-decoration:underline; width:100%; margin-top:6px; font-size:.9rem; }
.rep-card { display:grid; gap:4px; }
.radio { display:flex; gap:10px; align-items:center; padding:10px; margin:6px 0; background:#0f1728; border-radius:8px; }
.radio input { width:20px; height:20px; flex:none; }
.note { display:grid; gap:4px; margin-top:10px; }
.repoverlay { position:fixed; inset:0; z-index:25; background:#e5e7eb; overflow:auto; -webkit-overflow-scrolling:touch; }
.repoverlay[hidden] { display:none; }
.rep-actions { position:sticky; top:0; display:flex; gap:6px; padding:8px; padding-top:calc(8px + env(safe-area-inset-top)); background:var(--bg); z-index:1; }
.rep-actions button { flex:1; padding:10px 4px; font-size:.9rem; min-width:0; }
@media print {
  body.print-report > *:not(#reportOverlay) { display:none !important; }
  body.print-report { background:#fff; }
  body.print-report #reportOverlay { position:static; overflow:visible; background:#fff; }
  body.print-report .rep-actions { display:none; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🔍 <span data-i18n="title">Détecteur Caméra &amp; Micro</span></h1>
    <select id="lang" aria-label="Langue / Language"></select>
  </div>
  <nav>
    <button class="tab active" data-tab="scan"><span data-i18n="tabScan">Scanner</span></button>
    <button class="tab" data-tab="photos"><span data-i18n="tabPhotos">Photos</span> <span id="photoCount">0</span></button>
    <button class="tab" data-tab="report"><span data-i18n="tabReport">Rapport</span></button>
    <button class="tab" data-tab="guide"><span data-i18n="tabGuide">Guide</span></button>
  </nav>
</header>

<main>
  <section id="scan" class="panel active">
    <div id="roomBar" class="roombar" hidden>
      <span id="roomBarName"></span>
      <button id="roomDoneBtn" class="primary" data-i18n="roomFinish"></button>
    </div>
    <div id="viewer">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="status" class="status idle" role="status" aria-live="polite"></div>
      <div id="flash"></div>
    </div>

    <div class="controls">
      <button id="startBtn" class="primary"></button>
      <button id="torchBtn" disabled data-i18n="torch"></button>
      <button id="switchBtn" disabled data-i18n="switchCam"></button>
      <button id="snapBtn" disabled data-i18n="photo"></button>
    </div>

    <div class="settings">
      <label><span data-i18n="mode"></span>
        <select id="mode">
          <option value="reflet" data-i18n="modeReflect"></option>
          <option value="ir" data-i18n="modeIR"></option>
        </select>
      </label>
      <label><span><span data-i18n="sensitivity"></span> <b id="sensVal">5</b></span>
        <input id="sens" type="range" min="1" max="10" value="5">
      </label>
      <label class="check"><input id="autoShot" type="checkbox" checked> <span data-i18n="autoShot"></span></label>
      <label class="check"><input id="sound" type="checkbox" checked> <span data-i18n="sound"></span></label>
    </div>

    <div class="card" id="magCard">
      <h3 data-i18n="magTitle"></h3>
      <p id="magInfo"></p>
      <div class="meter"><div id="magBar"></div></div>
      <p class="small" data-i18n="magHint"></p>
    </div>
  </section>

  <section id="photos" class="panel">
    <div class="row">
      <h2 data-i18n="photosTitle"></h2>
      <button id="clearBtn" data-i18n="clearAll"></button>
    </div>
    <p class="small" data-i18n="photosHint"></p>
    <div id="gallery"></div>
  </section>

  <section id="report" class="panel">
    <h2 data-i18n="repTitle"></h2>
    <div id="reportNew">
      <p class="small" data-i18n="repIntro"></p>
      <div class="settings">
        <label><span data-i18n="repProperty"></span><input id="repProperty" type="text" maxlength="80" data-i18n-ph="repPropertyPh" autocomplete="off"></label>
        <label><span data-i18n="repAddress"></span><input id="repAddress" type="text" maxlength="120" autocomplete="off"></label>
        <label><span data-i18n="repBy"></span><input id="repBy" type="text" maxlength="80" autocomplete="off"></label>
        <button id="repStartBtn" class="primary" data-i18n="repStart"></button>
      </div>
    </div>
    <div id="reportCurrent" hidden>
      <p><b id="repHead"></b></p>
      <h3 data-i18n="repRooms"></h3>
      <ul id="roomList" class="rooms"></ul>
      <div id="roomSuggest" class="chips"></div>
      <div class="addroom">
        <input id="roomName" type="text" maxlength="40" data-i18n-ph="repRoomPh" autocomplete="off">
        <button id="roomAddBtn" data-i18n="repAddRoom"></button>
      </div>
      <button id="repFinishBtn" class="primary wide" data-i18n="repFinish"></button>
      <button id="repCancelBtn" class="linkbtn" data-i18n="repCancel"></button>
    </div>
    <h3 data-i18n="repDone"></h3>
    <div id="reportList"></div>
  </section>

  <section id="guide" class="panel">
    <h2 data-i18n="guideTitle"></h2>
    <ol id="guideList"></ol>
    <div class="card warn" id="guideWarn"></div>
  </section>
</main>

<div id="permHelp" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="permTitle">
  <div class="modal-box">
    <h2 id="permTitle" data-i18n="permTitle"></h2>
    <p id="permIntro" data-i18n="permIntro"></p>
    <ol id="permSteps"></ol>
    <div class="controls">
      <button id="permRetry" class="primary" data-i18n="retry"></button>
      <button id="permClose" data-i18n="close"></button>
    </div>
  </div>
</div>

<div id="roomResult" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="resTitle">
  <div class="modal-box">
    <h2 id="resTitle"></h2>
    <p id="resStats" class="small"></p>
    <label class="radio"><input type="radio" name="roomRes" value="clear"> <span data-i18n="stClear"></span></label>
    <label class="radio"><input type="radio" name="roomRes" value="false"> <span data-i18n="stFalse"></span></label>
    <label class="radio"><input type="radio" name="roomRes" value="suspect"> <span data-i18n="stSuspect"></span></label>
    <label class="note"><span data-i18n="repNote"></span><textarea id="resNote" rows="2" maxlength="300"></textarea></label>
    <div class="controls"><button id="resSave" class="primary" data-i18n="repSave"></button></div>
  </div>
</div>

<div id="reportOverlay" class="repoverlay" hidden>
  <div class="rep-actions">
    <button id="repViewPrint" data-i18n="repPrint"></button>
    <button id="repViewShare" data-i18n="repShare"></button>
    <button id="repViewClose" data-i18n="close"></button>
  </div>
  <div id="reportDoc"></div>
</div>

<div id="photoViewer" class="viewer" hidden><img id="viewerImg" alt=""><span class="close">✕</span></div>

        if (x > 0 && halo[i - 1] !== haloMark && lum[i - 1] >= thr) { halo[i - 1] = haloMark; hstack[sp++] = i - 1; }
        if (x < W - 1 && halo[i + 1] !== haloMark && lum[i + 1] >= thr) { halo[i + 1] = haloMark; hstack[sp++] = i + 1; }
        if (y > 0 && halo[i - W] !== haloMark && lum[i - W] >= thr) { halo[i - W] = haloMark; hstack[sp++] = i - W; }
        if (y < H - 1 && halo[i + W] !== haloMark && lum[i + W] >= thr) { halo[i + W] = haloMark; hstack[sp++] = i + W; }
      }
      const hw = maxX - minX + 1, hh = maxY - minY + 1;
      if (Math.max(hw, hh) / Math.min(hw, hh) > 2.5) return false;          // allongé (tige, trait)
      if (area >= 4 && elongation(area, sx, sy, sxx, syy, sxy) > 2) return false; // allongé en diagonale
      if (area > Math.max(12, (size + 2) * (size + 2) * 2)) return false;     // trop grand
      return true;
    }

    // Composantes connexes (taches lumineuses).
    const maxArea = Math.max(12, Math.round((W * H) / 600));
    const maxSide = Math.max(5, Math.round(W / 18));
    const blobs = [];
    const stack = new Int32Array(N);
    for (let start = 0; start < N; start++) {
      if (mask[start] !== 1) continue;
      let sp = 0, area = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, sumL = 0, peak = 0, peakIdx = start;
      let minX = W, minY = H, maxX = 0, maxY = 0;
      stack[sp++] = start; mask[start] = 2;
      while (sp) {
        const i = stack[--sp];
        const x = i % W, y = (i / W) | 0;
        area++; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y; sumL += lum[i];
        if (lum[i] > peak) { peak = lum[i]; peakIdx = i; }
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        const nb = [i - 1, i + 1, i - W, i + W];
        for (let k = 0; k < 4; k++) {
          const j = nb[k];
          if (j < 0 || j >= N) continue;
          if ((k === 0 && x === 0) || (k === 1 && x === W - 1)) continue;
          if (mask[j] === 1) { mask[j] = 2; stack[sp++] = j; }
        }
      }
      const bw = maxX - minX + 1, bh = maxY - minY + 1;
      if (area < 1 || area > maxArea) continue;          // trop gros = lampe, fenêtre…
      if (bw > maxSide || bh > maxSide) continue;
      const aspect = Math.max(bw, bh) / Math.min(bw, bh);
      if (aspect > 2.2) continue;                        // une lentille est ronde
      const fill = area / (bw * bh);
      if (area > 3 && fill < 0.35) continue;
      // Test d'isolement : une lentille est un petit point SEUL dans une zone plus sombre.
      // Un coin d'écran, un détail d'image ou un reflet sur une tige métallique fait partie
      // d'une forme claire plus grande ou allongée -> rejeté.
      if (area >= 4 && elongation(area, sx, sy, sxx, syy, sxy) > 2) continue; // allongé, quel que soit l'angle
      if (!isolated(peakIdx, peak, Math.max(bw, bh))) continue;
      const cx = sx / area, cy = sy / area;
      const contrast = sumL / area - localMean(Math.round(cx), Math.round(cy));
      const roundness = 1 / aspect;
      const score = Math.min(1, (contrast / 160) * 0.6 + roundness * 0.25 + fill * 0.15);
      blobs.push({ x: cx, y: cy, r: Math.max(bw, bh) / 2 + 1, area, contrast, score });
    }

    blobs.sort((a, b) => b.score - a.score);
    // Beaucoup de taches = surface brillante/pailletée : on ne garde que les meilleures.
    const noisy = blobs.length > 25;
    return { blobs: blobs.slice(0, noisy ? 3 : 10), noisy, sceneMean };
  }

  // Suivi dans le temps : une vraie lentille reste visible plusieurs images de suite.
  function Tracker(opts) {
    this.minHits = (opts && opts.minHits) || 4;
    this.maxDist = (opts && opts.maxDist) || 14;
    this.tracks = [];
    this.nextId = 1;
  }
  Tracker.prototype.update = function (blobs) {
    const used = new Set();
    for (const t of this.tracks) {
      let best = -1, bestD = this.maxDist;
      blobs.forEach((b, i) => {
        if (used.has(i)) return;
        const d = Math.hypot(b.x - t.x, b.y - t.y);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best >= 0) {
        const b = blobs[best]; used.add(best);
        t.x = t.x * 0.5 + b.x * 0.5; t.y = t.y * 0.5 + b.y * 0.5;
        t.r = b.r; t.score = b.score; t.hits++; t.miss = 0;
      } else {
        t.miss++;
      }
    }
    this.tracks = this.tracks.filter(t => t.miss < 3);
    blobs.forEach((b, i) => {
      if (!used.has(i)) this.tracks.push({ id: this.nextId++, x: b.x, y: b.y, r: b.r, score: b.score, hits: 1, miss: 0, shot: false });
    });
    return this.tracks.filter(t => t.hits >= this.minHits && t.miss === 0);
  };

  const api = { analyze, Tracker };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Detector = api;
})(this);

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  window.App = window.App || { context: null };
  const t = (k, v) => I18N.t(k, v);
  const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
  const statusEl = $('status');
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const PROC_W = 320;
  const MIN_HITS = 4;

  let stream = null, track = null, running = false, starting = false, torchOn = false;
  let facing = 'environment';
  let tracker = new Detector.Tracker({ minHits: MIN_HITS });
  let lastShot = 0, lastAlert = 0, audioCtx = null;

  // ---------- Langue ----------
  const langSel = $('lang');
  I18N.languages.forEach(l => { const o = document.createElement('option'); o.value = l.code; o.textContent = l.name; langSel.appendChild(o); });
  langSel.value = I18N.lang;
  langSel.addEventListener('change', () => I18N.set(langSel.value));
  document.addEventListener('langchange', refreshTexts);

  function refreshTexts() {
    I18N.apply();
    $('startBtn').textContent = t(running ? 'stop' : 'start');
    renderStatus();
    renderMag();
    $('torchBtn').title = track && $('torchBtn').disabled ? t('torchUnsupported') : '';
    if ($('photos').classList.contains('active')) renderGallery();
  }

  // ---------- Statut (mémorisé pour pouvoir changer de langue) ----------
  let status = { key: 'statusIdle', cls: 'idle', vars: null }, holdUntil = 0;
  function setStatus(key, cls, vars, holdMs) {
    if (!holdMs && Date.now() < holdUntil) return; // un message important reste affiché un moment
    status = { key, cls, vars: vars || null };
    holdUntil = holdMs ? Date.now() + holdMs : 0;
    renderStatus();
  }
  function renderStatus() {
    let txt = t(status.key, status.vars);
    statusEl.textContent = (status.cls === 'alert' && status.vars && status.vars.count ? '⚠️ ' + txt + ' (' + status.vars.count + ')' : txt);
    statusEl.className = 'status ' + status.cls;
  }

  // ---------- Onglets ----------
  function showTab(name) {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === name));
    if (name === 'photos') renderGallery();
    emit('tab', name);
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

  // ---------- Petite API pour les modules (rapport de scan) ----------
  const listeners = {};
  function on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); }
  function emit(evt, data) { (listeners[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); }

  $('sens').addEventListener('input', e => { $('sensVal').textContent = e.target.value; });
  $('mode').addEventListener('change', () => { tracker = new Detector.Tracker({ minHits: MIN_HITS }); });

  // ---------- Caméra ----------
  async function openCamera() {
    const s = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    if (stream) stream.getTracks().forEach(x => x.stop());
    stream = s;
    track = stream.getVideoTracks()[0];
    track.addEventListener('ended', () => { if (running) { stop(); setStatus('cameraLost', 'alert', null, 4000); } });
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* autoplay : la vidéo démarrera quand même (muted + playsinline) */ }
    torchOn = false;
    $('torchBtn').classList.remove('on');
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('torchBtn').disabled = !caps.torch;
    $('torchBtn').title = caps.torch ? '' : t('torchUnsupported');
    tracker = new Detector.Tracker({ minHits: MIN_HITS });
  }

  // ---------- Aide « autoriser la caméra » ----------
  // Un site web ne peut pas ouvrir les réglages du téléphone : on affiche les étapes exactes
  // pour l'appareil, et le scan démarre tout seul dès que la caméra est autorisée.
  const ua = navigator.userAgent || '';
  const platform = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios'
    : /Android/.test(ua) ? 'android' : 'desktop';
  const isMobile = platform !== 'desktop';
  function renderPermHelp() {
    const ol = $('permSteps'); ol.innerHTML = '';
    const steps = location.protocol === 'file:' && isMobile ? [t('permFile')]
      : t(platform === 'ios' ? 'permIOS' : platform === 'android' ? 'permAndroid' : 'permDesktop');
    steps.forEach(x => { const li = document.createElement('li'); li.textContent = x; ol.appendChild(li); });
  }
  function showPermHelp() { renderPermHelp(); $('permHelp').hidden = false; $('permRetry').focus(); }
  function hidePermHelp() { $('permHelp').hidden = true; }
  $('permRetry').onclick = () => { hidePermHelp(); start(); };
  $('permClose').onclick = hidePermHelp;
  document.addEventListener('langchange', () => { if (!$('permHelp').hidden) renderPermHelp(); });
  // Dès que la caméra est autorisée dans les réglages, on démarre le scan automatiquement.
  try {
    navigator.permissions.query({ name: 'camera' }).then(ps => {
      ps.onchange = () => { if (ps.state === 'granted' && !$('permHelp').hidden && !running) { hidePermHelp(); start(); } };
    }).catch(() => {});
  } catch (e) {}

  async function start() {
    if (starting) return;
    if (running) { stop(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('noCamera', 'alert', null, 6000);
      if (location.protocol === 'file:' || !window.isSecureContext) showPermHelp();
      return;
    }
    starting = true;
    initAudio();
    try {
      await openCamera();
    } catch (err) {
      starting = false;
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      setStatus(denied ? 'cameraDenied' : 'cameraError', 'alert', { e: (err && (err.message || err.name)) || '?' }, 6000);
      showPermHelp();
      return;
    }
    hidePermHelp();
    starting = false;
    running = true;
    $('snapBtn').disabled = false;
    $('switchBtn').disabled = false;
    $('startBtn').textContent = t('stop');
    startMagnetometer();
    holdUntil = 0;
    setStatus('scanning', 'ok');
    requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    if (stream) stream.getTracks().forEach(x => x.stop());
    stream = null; track = null; torchOn = false;
    video.srcObject = null;
    $('torchBtn').classList.remove('on');
    ['torchBtn', 'snapBtn', 'switchBtn'].forEach(id => ($(id).disabled = true));
    $('startBtn').textContent = t('start');
    octx.clearRect(0, 0, overlay.width, overlay.height);
    setStatus('stopped', 'idle');
  }

  async function switchCamera() {
    if (!running) return;
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await openCamera(); }
    catch (err) { facing = facing === 'environment' ? 'user' : 'environment'; setStatus('cameraError', 'alert', { e: err.message || err.name }, 4000); }
  }

  async function toggleTorch() {
    if (!track) return;
    const want = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: want }] });
      torchOn = want;
      $('torchBtn').classList.toggle('on', torchOn);
    } catch (e) { setStatus('torchFail', 'alert', null, 3000); }
  }

  // Couper la caméra quand l'application passe en arrière-plan (vie privée + batterie).
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
    // Retour depuis les réglages du téléphone : on réessaie tout seul.
    else if (!document.hidden && !$('permHelp').hidden && !running) {
      try {
        navigator.permissions.query({ name: 'camera' }).then(ps => { if (ps.state === 'granted') { hidePermHelp(); start(); } }).catch(() => {});
      } catch (e) {}
    }
  });

  // ---------- Boucle d'analyse ----------
  let lastProc = 0;
  function loop(ts) {
    if (!running) return;
    requestAnimationFrame(loop);
    if (ts - lastProc < 66 || !video.videoWidth || video.readyState < 2) return; // ~15 analyses / seconde
    lastProc = ts;

    const vw = video.videoWidth, vh = video.videoHeight;
    const pw = PROC_W, ph = Math.round(PROC_W * vh / vw);
    if (work.width !== pw || work.height !== ph) { work.width = pw; work.height = ph; tracker = new Detector.Tracker({ minHits: MIN_HITS }); }
    wctx.drawImage(video, 0, 0, pw, ph);
    let img;
    try { img = wctx.getImageData(0, 0, pw, ph); } catch (e) { return; }
    const mode = $('mode').value;
    const res = Detector.analyze(img, { mode, sensitivity: +$('sens').value });
    const confirmed = tracker.update(res.blobs);
    emit('frame', { confirmed, crowded: confirmed.length >= 4 });

    drawOverlay(res.blobs, confirmed, pw, ph);

    if (confirmed.length >= 4) {
      // Beaucoup de points à la fois : écran, lustre ou surface brillante, pas des caméras.
      setStatus('noisy', 'idle');
    } else if (confirmed.length) {
      setStatus(mode === 'ir' ? 'alertIR' : 'alertLens', 'alert', { count: confirmed.length });
      const now = Date.now();
      if ($('sound').checked && now - lastAlert > 1500) { beep(); vibrate(); lastAlert = now; }
      const fresh = confirmed.filter(x => !x.shot);
      if ($('autoShot').checked && fresh.length && now - lastShot > 4000) {
        fresh.forEach(x => (x.shot = true));
        takePhoto(confirmed, pw, true);
        lastShot = now;
      }
    } else if (res.noisy) {
      setStatus('noisy', 'idle');
    } else {
      setStatus('nothing', 'ok');
    }
  }

  // Conversion coordonnées d'analyse -> écran (vidéo en object-fit: cover)
  function mapper(pw, ph) {
    const W = overlay.clientWidth, H = overlay.clientHeight;
    const scale = Math.max(W / pw, H / ph);
    const ox = (W - pw * scale) / 2, oy = (H - ph * scale) / 2;
    return { W, H, scale, f: (x, y) => [ox + x * scale, oy + y * scale] };
  }

  function drawOverlay(blobs, confirmed, pw, ph) {
    const dpr = window.devicePixelRatio || 1;
    const m = mapper(pw, ph);
    if (!m.W || !m.H) return;
    const cw = Math.round(m.W * dpr), ch = Math.round(m.H * dpr);
    if (overlay.width !== cw || overlay.height !== ch) { overlay.width = cw; overlay.height = ch; }
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, m.W, m.H);
    octx.lineWidth = 2;
    octx.strokeStyle = 'rgba(250,204,21,.8)';
    for (const b of blobs) {
      const [x, y] = m.f(b.x, b.y);
      octx.beginPath(); octx.arc(x, y, Math.max(8, b.r * m.scale + 6), 0, Math.PI * 2); octx.stroke();
    }
    octx.lineWidth = 4; octx.strokeStyle = '#ef4444'; octx.fillStyle = '#ef4444';
    octx.font = 'bold 14px system-ui';
    octx.direction = 'ltr'; octx.textAlign = 'left';
    for (const c of confirmed) {
      const [x, y] = m.f(c.x, c.y);
      const r = Math.max(16, c.r * m.scale + 14);
      octx.beginPath(); octx.arc(x, y, r, 0, Math.PI * 2); octx.stroke();
      octx.fillText(Math.round(c.score * 100) + '%', x + r + 4, y + 5);
    }
  }

  // ---------- Photo ----------
  function takePhoto(marks, pw, auto) {
    if (!video.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(video, 0, 0);
    marks = marks || [];
    if (marks.length && pw) {
      const k = c.width / pw;
      ctx.lineWidth = Math.max(4, c.width / 200); ctx.strokeStyle = '#ef4444';
      for (const m of marks) { ctx.beginPath(); ctx.arc(m.x * k, m.y * k, Math.max(30, m.r * k * 3), 0, Math.PI * 2); ctx.stroke(); }
    }
    const date = new Date();
    const modeKey = $('mode').value === 'ir' ? 'modeNameIR' : 'modeNameReflect';
    const info = marks.length ? { key: 'photoPoints', n: marks.length, m: modeKey } : { key: 'photoManual' };
    const fs = Math.max(18, c.width / 45);
    ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, c.height - fs * 1.8, c.width, fs * 1.8);
    ctx.fillStyle = '#fff';
    const rtl = document.documentElement.dir === 'rtl';
    ctx.direction = rtl ? 'rtl' : 'ltr'; ctx.textAlign = 'start';
    ctx.fillText(date.toLocaleString(I18N.lang) + '  •  ' + infoText(info), rtl ? c.width - fs * 0.5 : fs * 0.5, c.height - fs * 0.6, c.width - fs);

    $('flash').style.opacity = 0.8; setTimeout(() => ($('flash').style.opacity = 0), 120);
    c.toBlob(blob => {
      if (!blob) { setStatus('saveFail', 'alert', null, 3000); return; }
      const ctxInfo = window.App.context ? { reportId: App.context.reportId, roomId: App.context.roomId } : {};
      savePhoto(Object.assign({ blob, date: date.toISOString(), info, auto: !!auto }, ctxInfo))
        .then(id => { updateCount(); emit('photo', { id, auto: !!auto }); })
        .catch(() => setStatus('saveFail', 'alert', null, 3000));
    }, 'image/jpeg', 0.9);
  }
  function infoText(info) {
    if (!info) return '';
    if (typeof info === 'string') return info; // anciennes photos
    return info.key === 'photoPoints' ? t('photoPoints', { n: info.n, m: t(info.m) }) : t(info.key);
  }

  // ---------- Stockage local (IndexedDB) ----------
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no indexedDB'));
        const r = indexedDB.open('detecteur', 2);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
          if (!d.objectStoreNames.contains('reports')) d.createObjectStore('reports', { keyPath: 'id', autoIncrement: true });
        };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      dbp.catch(() => { dbp = null; });
    }
    return dbp;
  }
  function run(mode, fn, storeName) {
    storeName = storeName || 'photos';
    return db().then(d => new Promise((res, rej) => {
      const tx = d.transaction(storeName, mode);
      const r = fn(tx.objectStore(storeName));
      tx.oncomplete = () => res(r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    }));
  }
  const savePhoto = p => run('readwrite', s => s.add(p));
  const allPhotos = () => run('readonly', s => s.getAll());
  const delPhoto = id => run('readwrite', s => s.delete(id));
  const clearPhotos = () => run('readwrite', s => s.clear());

  function updateCount() { allPhotos().then(l => ($('photoCount').textContent = l.length)).catch(() => {}); }

  let urls = [];
  async function renderGallery() {
    const g = $('gallery');
    let list;
    try { list = (await allPhotos()).reverse(); }
    catch (e) { g.textContent = t('storageFail'); return; }
    urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
    g.innerHTML = '';
    if (!list.length) { const p = document.createElement('p'); p.className = 'small'; p.textContent = t('noPhotos'); g.appendChild(p); return; }
    for (const p of list) {
      const u = URL.createObjectURL(p.blob); urls.push(u);
      const name = 'detection-' + p.date.replace(/[:.]/g, '-') + '.jpg';
      const el = document.createElement('div'); el.className = 'shot';
      const a = document.createElement('button'); a.className = 'thumb';
      const im = document.createElement('img'); im.src = u; im.alt = ''; a.appendChild(im);
      a.onclick = () => openViewer(u);
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = new Date(p.date).toLocaleString(I18N.lang) + ' — ' + infoText(p.info) + (p.auto ? ' ' + t('auto') : '');
      const acts = document.createElement('div'); acts.className = 'acts';
      const bSave = iconBtn('💾', t('save'));
      bSave.onclick = () => { const d = document.createElement('a'); d.href = u; d.download = name; document.body.appendChild(d); d.click(); d.remove(); };
      acts.appendChild(bSave);
      const file = (typeof File === 'function') ? new File([p.blob], name, { type: 'image/jpeg' }) : null;
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        const bShare = iconBtn('📤', t('share'));
        bShare.onclick = () => navigator.share({ files: [file] }).catch(() => {});
        acts.appendChild(bShare);
      }
      const bDel = iconBtn('🗑', t('delete'));
      bDel.onclick = async () => { try { await delPhoto(p.id); } catch (e) {} renderGallery(); updateCount(); };
      acts.appendChild(bDel);
      el.append(a, meta, acts);
      g.appendChild(el);
    }
  }
  function iconBtn(icon, label) {
    label = String(label).replace(/^[^\p{L}]+/u, ''); // retire l'emoji du libellé
    const b = document.createElement('button'); b.textContent = icon; b.title = label; b.setAttribute('aria-label', label);
    return b;
  }
  function openViewer(u) { $('viewerImg').src = u; $('photoViewer').hidden = false; }
  function closeViewer() { $('photoViewer').hidden = true; $('viewerImg').removeAttribute('src'); }
  $('photoViewer').onclick = closeViewer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeViewer(); hidePermHelp(); } });

  $('clearBtn').onclick = async () => {
    if (!confirm(t('confirmClear'))) return;
    try { await clearPhotos(); } catch (e) {}
    renderGallery(); updateCount();
  };

  // ---------- Son et vibration ----------
  function initAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 1200; o.type = 'square'; g.gain.value = 0.08;
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }
  function vibrate() { try { if (navigator.vibrate) navigator.vibrate([150, 80, 150]); } catch (e) {} }

  // ---------- Magnétomètre (micros / électronique) ----------
  let mag = { state: 'init', v: 0, d: 0, err: '' }, magBase = null, magStarted = false;
  function renderMag() {
    let s;
    if (mag.state === 'init') s = t('magInit');
    else if (mag.state === 'unsupported') s = t('magNotSupported');
    else if (mag.state === 'error') s = t('magUnavailable', { e: mag.err });
    else s = t('magField', { v: mag.v, d: mag.d }) + (mag.d > 25 ? t('magWarn') : '');
    $('magInfo').textContent = s;
  }
  function startMagnetometer() {
    if (magStarted) return;
    if (!('Magnetometer' in window)) { mag.state = 'unsupported'; renderMag(); return; }
    try {
      const sensor = new Magnetometer({ frequency: 10 });
      sensor.addEventListener('reading', () => {
        const v = Math.hypot(sensor.x, sensor.y, sensor.z);
        if (!isFinite(v)) return;
        magBase = magBase == null ? v : magBase * 0.995 + v * 0.005; // champ terrestre moyen
        const d = Math.abs(v - magBase);
        mag = { state: 'ok', v: Math.round(v), d: Math.round(d), err: '' };
        $('magBar').style.width = Math.min(100, d * 2) + '%';
        renderMag();
        if (d > 25 && running && $('sound').checked && Date.now() - lastAlert > 1500) { beep(); lastAlert = Date.now(); }
      });
      sensor.addEventListener('error', e => { mag = { state: 'error', err: (e.error && e.error.name) || '?' }; renderMag(); });
      sensor.start(); magStarted = true;
    } catch (e) { mag = { state: 'error', err: e.name || e.message }; renderMag(); }
  }

  $('startBtn').onclick = start;
  $('torchBtn').onclick = toggleTorch;
  $('switchBtn').onclick = switchCamera;
  $('snapBtn').onclick = () => takePhoto(tracker.tracks.filter(x => x.hits >= MIN_HITS && x.miss === 0), work.width, false);

  const App = window.App;
  Object.assign(App, {
    t, on, showTab, start, stop, setStatus, iconBtn, openViewer, infoText,
    isRunning: () => running,
    settings: () => ({ mode: $('mode').value, sensitivity: +$('sens').value }),
    store: (name, mode, fn) => run(mode, fn, name),
    getPhoto: id => run('readonly', s => s.get(id))
  });
  refreshTexts();
  updateCount();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<script>
// Mode « Rapport de scan » : vérification pièce par pièce + rapport daté avec photos.
(function () {
  'use strict';
  const App = window.App;
  const $ = id => document.getElementById(id);
  const t = (k, v) => I18N.t(k, v);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SHORT_SCAN_MS = 20000;

  // ---------- Stockage ----------
  const reports = {
    all: () => App.store('reports', 'readonly', s => s.getAll()),
    get: id => App.store('reports', 'readonly', s => s.get(id)),
    put: r => App.store('reports', 'readwrite', s => s.put(r)),
    del: id => App.store('reports', 'readwrite', s => s.delete(id))
  };
  let draft = null;          // rapport en cours
  let session = null;        // pièce en cours de scan

  async function loadDraft() {
    try { draft = (await reports.all()).find(r => r.status === 'draft') || null; } catch (e) { draft = null; }
  }
  async function saveDraft() { if (draft) draft.id = await reports.put(draft); }

  // ---------- Écran « Rapport » ----------
  async function render() {
    $('reportNew').hidden = !!draft;
    $('reportCurrent').hidden = !draft;
    renderSuggestions();
    if (draft) renderDraft();
    renderList();
  }

  function renderSuggestions() {
    const box = $('roomSuggest'); box.innerHTML = '';
    const names = draft ? draft.rooms.map(r => r.name.toLowerCase()) : [];
    (t('repSuggest') || []).forEach(name => {
      if (names.includes(name.toLowerCase())) return;
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = '+ ' + name;
      b.onclick = () => addRoom(name);
      box.appendChild(b);
    });
  }

  function statusBadge(st) {
    const map = { clear: ['ok', 'stClear'], false: ['warn', 'stFalse'], suspect: ['bad', 'stSuspect'], pending: ['idle', 'stPending'] };
    const [cls, key] = map[st] || map.pending;
    const s = document.createElement('span'); s.className = 'badge ' + cls; s.textContent = t(key);
    return s;
  }

  function renderDraft() {
    $('repHead').textContent = draft.property + (draft.address ? ' — ' + draft.address : '');
    const ul = $('roomList'); ul.innerHTML = '';
    draft.rooms.forEach(room => {
      const li = document.createElement('li'); li.className = 'room';
      const top = document.createElement('div'); top.className = 'room-top';
      const name = document.createElement('b'); name.textContent = room.name;
      top.append(name, statusBadge(room.status));
      li.appendChild(top);
      if (room.status !== 'pending') {
        const st = document.createElement('div'); st.className = 'small';
        st.textContent = t('roomStats', { d: fmtDur(room.durationMs), a: room.alerts, p: room.photoIds.length })
          + (room.durationMs < SHORT_SCAN_MS ? ' • ⚠️ ' + t('repShortScan') : '') + (room.note ? ' • ' + room.note : '');
        li.appendChild(st);
      }
      const acts = document.createElement('div'); acts.className = 'room-acts';
      const bScan = document.createElement('button'); bScan.textContent = t(room.status === 'pending' ? 'repScanRoom' : 'repRescan');
      bScan.className = room.status === 'pending' ? 'primary' : '';
      bScan.onclick = () => startRoom(room.id);
      const bDel = App.iconBtn('🗑', t('delete'));
      bDel.onclick = async () => { draft.rooms = draft.rooms.filter(r => r.id !== room.id); await saveDraft(); render(); };
      acts.append(bScan, bDel);
      li.appendChild(acts);
      ul.appendChild(li);
    });
  }

  async function renderList() {
    const box = $('reportList'); box.innerHTML = '';
    let list = [];
    try { list = (await reports.all()).filter(r => r.status === 'final').reverse(); } catch (e) { /* stockage indisponible */ }
    if (!list.length) { const p = document.createElement('p'); p.className = 'small'; p.textContent = t('repNone'); box.appendChild(p); return; }
    list.forEach(r => {
      const card = document.createElement('div'); card.className = 'card rep-card';
      const h = document.createElement('b'); h.textContent = r.property;
      const meta = document.createElement('div'); meta.className = 'small';
      const susp = r.rooms.filter(x => x.status === 'suspect').length;
      meta.textContent = new Date(r.finishedAt).toLocaleString(I18N.lang) + ' • ' + t('repId') + ' ' + r.hash;
      const sum = document.createElement('div'); sum.className = 'small';
      sum.textContent = susp ? t('repSummarySuspect', { s: susp, n: r.rooms.length }) : t('repSummaryClear', { n: r.rooms.length });
      const acts = document.createElement('div'); acts.className = 'room-acts';
      const bView = document.createElement('button'); bView.textContent = t('repView'); bView.onclick = () => openReport(r);
      const bShare = document.createElement('button'); bShare.textContent = t('repShare'); bShare.onclick = () => shareReport(r);
      const bDel = App.iconBtn('🗑', t('delete'));
      bDel.onclick = async () => { if (confirm(t('repDeleteConfirm'))) { await reports.del(r.id); renderList(); } };
      acts.append(bView, bShare, bDel);
      card.append(h, meta, sum, acts);
      box.appendChild(card);
    });
  }

  // ---------- Création / pièces ----------
  async function createDraft() {
    const property = $('repProperty').value.trim();
    if (!property) { alert(t('repNeedName')); $('repProperty').focus(); return; }
    draft = {
      status: 'draft', property, address: $('repAddress').value.trim(), by: $('repBy').value.trim(),
      createdAt: new Date().toISOString(), rooms: [], nextRoom: 1
    };
    await saveDraft();
    $('repProperty').value = $('repAddress').value = $('repBy').value = '';
    render();
  }

  async function addRoom(name) {
    name = String(name || '').trim();
    if (!name || !draft) return;
    draft.rooms.push({ id: draft.nextRoom++, name, status: 'pending', note: '', durationMs: 0, frames: 0, alerts: 0, photoIds: [], scannedAt: null });
    await saveDraft();
    render();
  }

  async function cancelDraft() {
    if (!draft || !confirm(t('repConfirmCancel'))) return;
    endSession(false);
    await reports.del(draft.id);
    draft = null;
    render();
  }

  // ---------- Scan d'une pièce ----------
  function startRoom(roomId) {
    const room = draft && draft.rooms.find(r => r.id === roomId);
    if (!room) return;
    session = { roomId, start: Date.now(), frames: 0, alertIds: new Set(), photoIds: [] };
    App.context = { reportId: draft.id, roomId };
    $('roomBarName').textContent = t('roomScanning', { room: room.name });
    $('roomBar').hidden = false;
    App.showTab('scan');
    if (!App.isRunning()) App.start();
  }

  App.on('frame', ({ confirmed, crowded }) => {
    if (!session || !App.isRunning()) return;
    session.frames++;
    if (!crowded) confirmed.forEach(c => session.alertIds.add(c.id));
  });
  App.on('photo', ({ id }) => { if (session) session.photoIds.push(id); });

  function finishRoom() {
    if (!session) return;
    if (App.isRunning()) App.stop();
    const room = draft.rooms.find(r => r.id === session.roomId);
    const dur = Date.now() - session.start, alerts = session.alertIds.size;
    $('resTitle').textContent = t('roomResultTitle', { room: room.name });
    $('resStats').textContent = t('roomStats', { d: fmtDur(dur), a: alerts, p: session.photoIds.length }) + (dur < SHORT_SCAN_MS ? ' • ⚠️ ' + t('repShortScan') : '');
    document.querySelectorAll('input[name=roomRes]').forEach(i => { i.checked = i.value === (alerts ? 'false' : 'clear'); });
    $('resNote').value = room.note || '';
    session.durationMs = dur; session.alerts = alerts;
    $('roomResult').hidden = false;
  }

  async function saveRoomResult() {
    const room = draft.rooms.find(r => r.id === session.roomId);
    const choice = document.querySelector('input[name=roomRes]:checked');
    Object.assign(room, {
      status: choice ? choice.value : 'clear', note: $('resNote').value.trim(),
      durationMs: session.durationMs, frames: session.frames, alerts: session.alerts,
      photoIds: session.photoIds.slice(), scannedAt: new Date().toISOString()
    });
    $('roomResult').hidden = true;
    endSession(true);
    await saveDraft();
    App.showTab('report');
  }

  function endSession(keep) {
    session = null;
    App.context = null;
    $('roomBar').hidden = true;
    if (!keep) $('roomResult').hidden = true;
  }

  // ---------- Rapport final ----------
  async function finishDraft() {
    if (!draft) return;
    const scanned = draft.rooms.filter(r => r.status !== 'pending');
    if (!scanned.length) { alert(t('repNeedRoom')); return; }
    const btn = $('repFinishBtn'); btn.disabled = true; btn.textContent = t('repGenerating');
    try {
      const photos = {};
      for (const room of scanned) {
        for (const pid of room.photoIds) {
          try { const p = await App.getPhoto(pid); if (p && p.blob) photos[pid] = await shrink(p.blob, 1000); } catch (e) { /* photo supprimée */ }
        }
      }
      const final = {
        status: 'final', property: draft.property, address: draft.address, by: draft.by,
        createdAt: draft.createdAt, finishedAt: new Date().toISOString(), lang: I18N.lang,
        settings: App.settings(), rooms: scanned.map(r => Object.assign({}, r, { photoIds: r.photoIds.filter(id => photos[id]) })),
        photos
      };
      final.hash = await fingerprint(final);
      final.id = draft.id;
      await reports.put(final);
      draft = null;
      await render();
      openReport(final);
    } finally {
      btn.disabled = false; btn.textContent = t('repFinish');
    }
  }

  // Réduit une photo pour que le rapport reste léger (et partageable).
  function shrink(blob, max) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = e => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  // N° du rapport : empreinte du contenu (change si le contenu change).
  async function fingerprint(rep) {
    const txt = JSON.stringify([rep.property, rep.address, rep.by, rep.createdAt, rep.finishedAt, rep.rooms, Object.keys(rep.photos).map(k => rep.photos[k].length)]);
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf).slice(0, 5)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    } catch (e) {
      let h = 2166136261; for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
      return (h >>> 0).toString(16).toUpperCase().padStart(8, '0');
    }
  }

  function fmtDur(ms) {
    const s = Math.round((ms || 0) / 1000), m = Math.floor(s / 60);
    return m ? m + ' min ' + String(s % 60).padStart(2, '0') + ' s' : s + ' s';
  }

  // Le document du rapport (le même pour l'affichage, l'impression et le fichier partagé).
  const REP_CSS = `
.rep{background:#fff;color:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4;max-width:800px;margin:0 auto;padding:24px}
.rep h1{font-size:1.35rem;margin:0 0 4px}.rep h2{font-size:1.1rem;margin:0}
.rep .muted{color:#555;font-size:.9rem}.rep table{border-collapse:collapse;width:100%;margin:12px 0;font-size:.92rem}
.rep td{border:1px solid #ccc;padding:6px 8px;vertical-align:top}.rep td:first-child{width:35%;color:#444}
.rep .sum{padding:10px 12px;border-radius:8px;margin:12px 0;font-weight:600}.rep .sum.ok{background:#e8f6ec}.rep .sum.bad{background:#fdeaea}
.rep .rroom{background:#fff;color:#111;border:1px solid #ccc;border-radius:8px;padding:10px 12px;margin:10px 0;break-inside:avoid}
.rep .st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.85rem;font-weight:600;margin-top:4px}
.rep .st.clear{background:#e8f6ec;color:#14532d}.rep .st.false{background:#fff4d6;color:#713f12}.rep .st.suspect{background:#fdeaea;color:#7f1d1d}
.rep .ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}.rep .ph img{width:100%;border-radius:4px}
.rep .disc{font-size:.82rem;color:#444;border-top:1px solid #ccc;margin-top:16px;padding-top:10px}
.rep .sig{margin-top:28px;display:flex;gap:24px}.rep .sig div{flex:1;border-top:1px solid #888;padding-top:4px;font-size:.85rem;color:#444}
.rep[dir=rtl] td:first-child{text-align:right}`;

  function reportBody(r) {
    const L = (k, v) => I18N.tIn(r.lang, k, v);
    const loc = r.lang;
    const dir = I18N._T[r.lang] && I18N._T[r.lang]._rtl ? 'rtl' : 'ltr';
    const susp = r.rooms.filter(x => x.status === 'suspect').length;
    const modeName = L(r.settings && r.settings.mode === 'ir' ? 'modeNameIR' : 'modeNameReflect');
    const stKey = { clear: 'stClear', false: 'stFalse', suspect: 'stSuspect' };
    let h = `<div class="rep" dir="${dir}" lang="${esc(loc)}">`;
    h += `<h1>${esc(L('repDocTitle'))}</h1><h2><bdi>${esc(r.property)}</bdi></h2>`;
    if (r.address) h += `<div class="muted"><bdi>${esc(r.address)}</bdi></div>`;
    h += `<table>
      <tr><td>${esc(L('repId'))}</td><td><b>${esc(r.hash)}</b></td></tr>
      <tr><td>${esc(L('repStarted'))}</td><td>${esc(new Date(r.createdAt).toLocaleString(loc))}</td></tr>
      <tr><td>${esc(L('repFinished'))}</td><td>${esc(new Date(r.finishedAt).toLocaleString(loc))}</td></tr>
      ${r.by ? `<tr><td>${esc(L('repBy').replace(/\s*\(.*\)\s*$/, ''))}</td><td><bdi>${esc(r.by)}</bdi></td></tr>` : ''}
      <tr><td>${esc(L('repSettings'))}</td><td>${esc(modeName)} • ${esc(L('sensitivity'))} ${esc(r.settings ? r.settings.sensitivity : '')}</td></tr>
    </table>`;
    h += susp ? `<div class="sum bad">${esc(L('repSummarySuspect', { s: susp, n: r.rooms.length }))}</div>`
              : `<div class="sum ok">${esc(L('repSummaryClear', { n: r.rooms.length }))}</div>`;
    r.rooms.forEach(room => {
      h += `<div class="rroom"><b><bdi>${esc(room.name)}</bdi></b><br><span class="st ${esc(room.status)}">${esc(L(stKey[room.status] || 'stClear'))}</span>`;
      h += `<div class="muted">${esc(new Date(room.scannedAt).toLocaleTimeString(loc))} • ${esc(L('roomStats', { d: fmtDur(room.durationMs), a: room.alerts, p: room.photoIds.length }))}${room.durationMs < SHORT_SCAN_MS ? ' • ⚠️ ' + esc(L('repShortScan')) : ''}</div>`;
      if (room.note) h += `<div><bdi>${esc(room.note)}</bdi></div>`;
      if (room.photoIds.length) h += '<div class="ph">' + room.photoIds.map(id => `<img src="${r.photos[id]}" alt="">`).join('') + '</div>';
      h += '</div>';
    });
    h += `<div class="disc">${esc(L('repDisclaimer'))}</div>`;
    h += `<div class="sig"><div>${esc(L('repSignature'))}</div><div>${esc(L('repDateSig'))}</div></div></div>`;
    return h;
  }

  function reportFile(r) {
    const title = I18N.tIn(r.lang, 'repDocTitle') + ' — ' + r.property;
    return `<!doctype html><html lang="${esc(r.lang)}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>body{margin:0;background:#fff}${REP_CSS}</style></head><body>${reportBody(r)}</body></html>`;
  }
  function fileName(r) {
    const slug = String(r.property).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'rapport';
    return 'rapport-' + slug + '-' + r.finishedAt.slice(0, 10) + '.html';
  }

  let viewing = null;
  function openReport(r) {
    viewing = r;
    $('reportDoc').innerHTML = '<style>' + REP_CSS + '</style>' + reportBody(r);
    $('reportOverlay').hidden = false;
    $('reportOverlay').scrollTop = 0;
  }
  function closeReport() { $('reportOverlay').hidden = true; $('reportDoc').innerHTML = ''; viewing = null; }

  async function shareReport(r) {
    const html = reportFile(r);
    const name = fileName(r);
    const file = typeof File === 'function' ? new File([html], name, { type: 'text/html' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: r.property }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function printReport() {
    document.body.classList.add('print-report');
    const done = () => { document.body.classList.remove('print-report'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
    setTimeout(done, 60000);
  }

  // ---------- Événements ----------
  $('repStartBtn').onclick = createDraft;
  $('repCancelBtn').onclick = cancelDraft;
  $('repFinishBtn').onclick = finishDraft;
  $('roomAddBtn').onclick = () => { addRoom($('roomName').value); $('roomName').value = ''; };
  $('roomName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('roomAddBtn').click(); } });
  $('roomDoneBtn').onclick = finishRoom;
  $('resSave').onclick = saveRoomResult;
  $('repViewClose').onclick = closeReport;
  $('repViewPrint').onclick = printReport;
  $('repViewShare').onclick = () => viewing && shareReport(viewing);
  App.on('tab', name => { if (name === 'report') render(); });
  document.addEventListener('langchange', () => {
    if (session) { const room = draft.rooms.find(r => r.id === session.roomId); $('roomBarName').textContent = t('roomScanning', { room: room.name }); }
    if ($('report').classList.contains('active')) render();
  });

  loadDraft().then(render);
  window.Report = { _reportBody: reportBody, _fmtDur: fmtDur };
})();
</script>
