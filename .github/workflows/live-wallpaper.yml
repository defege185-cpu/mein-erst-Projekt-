name: Live Wallpaper - build & test

on:
  push:
    paths:
      - 'live-wallpaper/**'
      - '.github/workflows/live-wallpaper.yml'
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cd live-wallpaper\src
          rc /nologo /fo app.res app.rc || exit /b 1
          cl /nologo /O2 /EHsc /utf-8 /W3 main.cpp app.res /Fe:..\..\LiveWallpaper-msvc.exe /link /SUBSYSTEM:WINDOWS /MANIFEST:NO mfplat.lib mfuuid.lib ole32.lib oleaut32.lib shlwapi.lib wtsapi32.lib d3d11.lib dxgi.lib uuid.lib comdlg32.lib shell32.lib user32.lib advapi32.lib gdi32.lib || exit /b 1

      - name: Self-test behind the desktop icons
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $out = Join-Path $env:RUNNER_TEMP 'live-wallpaper'
          New-Item -ItemType Directory -Force $out | Out-Null
          $video = (Resolve-Path 'live-wallpaper\videos\rog-1-explosion-1080p.mp4').Path
          (New-Object -ComObject Shell.Application).MinimizeAll()
          $failed = $false
          foreach ($exe in @('LiveWallpaper-msvc.exe', 'live-wallpaper\dist\LiveWallpaper.exe')) {
            $name = [IO.Path]::GetFileNameWithoutExtension($exe)
            $log = Join-Path $out "$name.log"
            $p = Start-Process (Resolve-Path $exe).Path -ArgumentList "--test 14 --video `"$video`" --log `"$log`"" -PassThru
            Start-Sleep -Seconds 9
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $out "$name.png"))
            $red = 0; $n = 0
            for ($x = 0; $x -lt $b.Width; $x += 8) { for ($y = 0; $y -lt $b.Height; $y += 8) {
              $c = $bmp.GetPixel($x, $y); $n++
              if ($c.R -gt 140 -and $c.G -lt 100 -and $c.B -lt 100) { $red++ } } }
            Write-Host ("{0}: screen {1}x{2}, red pixels {3:N2} %" -f $name, $b.Width, $b.Height, (100.0 * $red / $n))
            if (-not $p.WaitForExit(40000)) { $p.Kill(); Write-Host "::error::$name did not exit"; $failed = $true }
            Get-Content $log
            if (-not (Select-String -Path $log -Pattern 'window ok' -Quiet)) { Write-Host "::error::$name log text is garbled"; $failed = $true }
            if ($p.ExitCode -ne 0) { Write-Host "::error::$name self-test failed (exit $($p.ExitCode))"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-wallpaper-${{ matrix.os }}
          path: ${{ runner.temp }}/live-wallpaper
          if-no-files-found: warn
