name: Optimiseur Windows - tests

on:
  push:
    paths:
      - 'optimiseur-windows/**'
      - '.github/workflows/optimiseur-windows.yml'
  pull_request:
    paths:
      - 'optimiseur-windows/**'
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests (Windows PowerShell 5.1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File optimiseur-windows\tests\Test-Optimiseur.ps1
      - name: Analyse PSScriptAnalyzer (erreurs)
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $r = Invoke-ScriptAnalyzer -Path optimiseur-windows -Recurse -Severity Error
          $r | Format-Table -AutoSize | Out-String -Width 200
          if ($r) { exit 1 }
